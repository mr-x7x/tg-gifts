<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 هدايا ستار تليجرام</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <i class="fas fa-star"></i>
                <span>هدايا ستار تليجرام</span>
            </div>
            <div class="nav-links">
                <a href="#collections" class="active">المجموعات</a>
                <a href="#trending">الأكثر طلباً</a>
                <a href="#categories">التصنيفات</a>
                <a href="#search"><i class="fas fa-search"></i> بحث</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1 class="hero-title">🌟 اكتشف عالم هدايا تليجرام الرائعة</h1>
            <p class="hero-subtitle">آلاف الهدايا والتأثيرات الرقمية الفريدة في مكان واحد</p>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن هدايا، مجموعات، أو تصنيفات...">
                <button id="searchBtn"><i class="fas fa-search"></i> بحث</button>
            </div>
            <div class="hero-stats">
                <div class="stat">
                    <i class="fas fa-layer-group"></i>
                    <span id="totalCollections">0</span>
                    <small>مجموعة</small>
                </div>
                <div class="stat">
                    <i class="fas fa-gift"></i>
                    <span id="totalGifts">0</span>
                    <small>هدية</small>
                </div>
                <div class="stat">
                    <i class="fas fa-tags"></i>
                    <span id="totalCategories">0</span>
                    <small>تصنيف</small>
                </div>
            </div>
        </div>
    </section>

    <!-- Collections Grid -->
    <section class="collections-section" id="collections">
        <div class="container">
            <div class="section-header">
                <h2><i class="fas fa-box-open"></i> مجموعات الهدايا</h2>
                <div class="filters">
                    <select id="categoryFilter">
                        <option value="">جميع التصنيفات</option>
                    </select>
                    <select id="sortFilter">
                        <option value="newest">الأحدث</option>
                        <option value="popular">الأكثر شيوعاً</option>
                        <option value="items">الأكثر عناصر</option>
                    </select>
                </div>
            </div>
            
            <div class="loading" id="collectionsLoading">
                <div class="spinner"></div>
                <p>جاري تحميل المجموعات...</p>
            </div>
            
            <div class="collections-grid" id="collectionsGrid">
                <!-- Collections will be loaded here -->
            </div>
            
            <div class="pagination" id="pagination">
                <!-- Pagination will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Collection Details Modal -->
    <div class="modal" id="collectionModal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalContent">
                <!-- Modal content will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>© 2024 هدايا ستار تليجرام. جميع الحقوق محفوظة.</p>
            <p class="api-info">API متاح على <code>/api</code></p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
      </html>
